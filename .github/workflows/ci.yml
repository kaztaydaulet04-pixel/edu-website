   name: CI/CD

   on:
     push:
       branches: [ main ]

   jobs:
     lint:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Install HTMLHint
           run: npm install -g htmlhint
         - name: Check HTML
           run: htmlhint "*.html"

     deploy:
       needs: lint
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: Deploy to GitHub Pages
           uses: peaceiris/actions-gh-pages@v4
           with:
             github_token: ${{ secrets.GITHUB_TOKEN }}
             publish_dir: ./